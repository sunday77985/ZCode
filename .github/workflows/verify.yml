name: 项目构建检查

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: 构建前端
    runs-on: ubuntu-latest
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 执行生产构建
        run: npm run build
